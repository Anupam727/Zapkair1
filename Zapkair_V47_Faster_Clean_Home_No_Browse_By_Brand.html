.zk-message-row{display:flex;position:relative;align-items:center;max-width:100%}.zk-mine{justify-content:flex-end}.zk-theirs{justify-content:flex-start}.zk-message-wrap{max-width:min(83%,420px);min-width:75px;transform:translateX(var(--swipe-x,0px));transition:transform .16s ease-out}.zk-message-bubble{padding:11px 13px;border-radius:19px;box-shadow:0 3px 12px #073c990c;overflow-wrap:anywhere}.zk-mine .zk-message-bubble{background:linear-gradient(135deg,#0756ed,#0756ed);color:white;border-bottom-right-radius:5px}.zk-theirs .zk-message-bubble{background:#fff;color:#073c99;border:1px solid #ffffff;border-bottom-left-radius:5px}.zk-message-time{font-size:10px;opacity:.65;text-align:right;margin-top:5px}.zk-quoted{font-size:11px;padding:8px;margin-bottom:8px;border-left:3px solid #0756ed;background:#ffffff24;border-radius:7px;max-height:65px;overflow:hidden}.zk-theirs .zk-quoted{background:#ffffff;color:#0756ed}.zk-unsent{background:#ffffff!important;color:#0756ed!important;border:1px dashed #ffffff!important}.zk-message-actions{display:flex;gap:2px;opacity:.55;align-self:center}.zk-message-actions button{padding:9px;color:#0756ed;border-radius:50%;font-size:12px}.zk-message-actions button:hover{background:#0756ed;color:#0756ed}.zk-swipe-hint{position:absolute;left:5px;color:#0756ed;opacity:.65}.zk-composer-wrap{background:#fff;border-top:1px solid #ffffff;box-shadow:0 -8px 24px #073c9906}.zk-composer{display:flex;gap:9px;align-items:flex-end;padding:7px;background:#ffffff;border:1px solid #ffffff;border-radius:25px}.zk-attach{width:39px;height:39px;flex-shrink:0;display:grid;place-items:center;color:#0756ed;border-radius:50%;cursor:pointer;font-size:19px}.zk-attach:hover{background:#0756ed}.zk-input{background:transparent;outline:0;resize:none;flex:1;min-width:0;max-height:120px;padding:10px 0;font-size:14px;line-height:20px}.zk-send{width:40px;height:40px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,#0756ed,#0756ed);color:#fff;box-shadow:0 4px 12         window.calculateDistance = function(lat1, lon1, lat2, lon2) {
            const R = 6371; // Radius of the earth in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c * 10) / 10; // Distance in km
        };

        // Local persistence for this browser. Cross-user listings, accounts and chat require Firebase configuration.

                    if (saved[k] !== undefined && saved[k] !== null) window.appState[k] = saved[k];

        // Per-account conversation visibility; never delete the other participant's history.
        const chatPrefsKey=()=>`zapkair_chat_prefs_${auth?.currentUser?.uid||'guest'}`;
        function chatPrefs(){try{return JSON.parse(localStorage.getItem(chatPrefsKey())||'{}')}catch{return {}}}
        function saveChatPref(id,changes){const all=chatPrefs();all[id]={...(all[id]||{}),...changes};localStorage.setItem(chatPrefsKey(),JSON.stringify(all))}
        function visibleChatMessages(id){const prefs=chatPrefs()[id]||{};return (appState.demoMessages?.[id]||[]).filter(m=>(m.createdMs||0)>(prefs.clearedAt||0))}
        // Account-scoped unread markers, synced to Firestore so the dot follows devices.
        function chatLastRead(chat){return Number(chat?.readAt?.[auth?.currentUser?.uid]||0)}
        function chatHasUnread(chat){return chatUnreadCount(chat)>0}
        function chatUnreadCount(chat){const uid=auth?.currentUser?.uid;if(!uid)return 0;const stored=Number(chat?.unreadCounts?.[uid]||0);if(stored>0)return stored;return !!(chat?.lastSenderId&&chat.lastSenderId!==uid&&Number(chat.updatedMs||0)>chatLastRead(chat)&&Number(chat.updatedMs||0)>Number(chatPrefs()[chat.id]?.clearedAt||0))?1:0}
        function updateUnreadBadge(){
          const count=(appState.chats||[]).reduce((sum,chat)=>sum+chatUnreadCount(chat),0);
          document.querySelectorAll('[data-zk-unread]').forEach(el=>{el.textContent=count>9?'9+':String(count);el.style.display=count?'inline-flex':'none'});
          const btn=document.getElementById('nav-btn-chats');if(btn){let dot=btn.querySelector('.zk-nav-unread');if(!dot){dot=document.createElement('span');dot.className='zk-nav-unread zk-unread-dot';dot.style.cssText='position:absolute;right:7px;top:0;';btn.style.position='relative';btn.appendChild(dot)}dot.style.display=count?'block':'none'}
          document.title=count?`(${count}) Zapkair`:'Zapkair';
        }
        let lastMarkedChat='',lastMarkedAt=0;

          const uid=auth?.currentUser?.uid,chat=(appState.chats||[]).find(c=>c.id===chatId);
          if(!uid||!chat||!chatHasUnread(chat))return;
          const now=Date.now();if(lastMarkedChat===chatId&&now-lastMarkedAt<1200)return;
          lastMarkedChat=chatId;lastMarkedAt=now;
          chat.readAt={...(chat.readAt||{}),[uid]:now};updateUnreadBadge();
          updateDoc(doc(db,'zapkairChats',chatId),{[`readAt.${uid}`]:now,[`unreadCounts.${uid}`]:0}).catch(e=>console.warn('Read marker:',e));
        }
        // The ad owner receives a Sell enquiry; the person enquiring sees it under Buy.
        // Keep a separate conversation per seller for two users who both sell to each other.
        let activeInboxTab='buy';
        function chatRole(chat){
          const uid=auth?.currentUser?.uid;
          if(chat.sellerId)return chat.sellerId===uid?'sell':'buy';
          // Legacy records: use listing ownership if known; otherwise default to Buy.
          const listing=(appState.listings||[]).find(x=>x.id===chat.listingId);
          const owner=listing?.ownerId||listing?.userId||listing?.sellerId;
          return owner===uid?'sell':'buy';
        }
        window.switchInboxTab=function(tab){

        function inboxChats(tab=activeInboxTab){
          // One inbox row per other user. Older per-listing conversations remain accessible in Firebase.
          const grouped=new Map();
          for(const chat of (appState.chats||[])){
            if(chatRole(chat)!==tab)continue;
            const other=(chat.participantIds||[]).find(x=>x!==auth?.currentUser?.uid)||chat.id;
            const prev=grouped.get(other);
            if(!prev||Number(chat.updatedMs||0)>Number(prev.updatedMs||0))grouped.set(other,chat);
          }
          return [...grouped.values()].sort((a,b)=>Number(b.updatedMs||0)-Number(a.updatedMs||0));
        }
        function otherChatName(chat){const uid=auth?.currentUser?.uid;const other=(chat.participantIds||[]).find(x=>x!==uid);return (chat.participantNames&&chat.participantNames[other])||chat.sellerName&&other===chat.sellerId&&chat.sellerName||'Zapkair user'}
        function currentChatName(){return (auth?.currentUser?.displayName||appState.userProfile?.name||auth?.currentUser?.email?.split('@')[0]||'Zapkair user').trim()}
        let unsubscribeListings=null,unsubscribeChats=null,unsubscribeMessages=null;

            if(appState.currentView==='chats')router.render();

        async function createUserNotification(uid,notification){

          document.getElementById('modalContainer').innerHTML=`<div class="fixed inset-0 z-[90] bg-slate-950/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="if(event.target===this)this.remove()"><section class="bg-white w-full sm:max-w-lg max-h-[86dvh] rounded-t-3xl sm:rounded-3xl overflow-hidden shadow-2xl flex flex-col"><header class="px-5 py-4 border-b flex items-center justify-between"><div><h3 class="text-lg font-extrabold">Notifications</h3><p class="text-xs text-gray-500">Ad approvals and account updates</p></div><div class="flex gap-2"><button onclick="markAllNotificationsRead()" class="text-xs font-bold text-emerald-700 px-2">Mark all read</button><button onclick="deleteAllNotifications()" class="text-xs font-bold text-red-600 px-2">Delete all</button><button onclick="document.getElementById('modalContainer').innerHTML=''" class="w-9 h-9 rounded-full bg-gray-100"><i class="fa-solid fa-xmark"></i></button></div></header><div id="notificationList" class="overflow-y-auto">${list.length?list.map(notificationMarkup).join(''):`<div class="p-10 text-center text-gray-500"><i class="fa-regular fa-bell-slash text-3xl text-emerald-600"></i><p class="font-bold mt-3">No notifications yet</p><p class="text-xs mt-1">Ad approvals and important account updates will appear here.</p></div>`}</div></section></div>`;
          markVisibleNotificationsRead().catch(e=>console.warn('Mark notification read:',e));

        function notificationMarkup(n){return `<div class="zk-notification-item ${n.readAt?'':'unread'}"><div class="zk-notification-icon"><i class="fa-solid ${n.type==='ad-deleted'?'fa-trash-can':n.type==='ad-approved'?'fa-circle-check':n.type==='ad-rejected'?'fa-circle-xmark':n.type==='ad-pending'?'fa-hourglass-half':n.type==='ad-published'?'fa-rectangle-ad':'fa-bell'}"></i></div><div class="flex-1 min-w-0"><p class="text-sm font-bold text-slate-800">${escapeHTML(n.title||'Zapkair update')}</p><p class="text-xs text-slate-600 mt-1">${escapeHTML(n.body||'You have a new update.')}</p><p class="text-[10px] text-slate-400 mt-2">${new Date(Number(n.createdMs||Date.now())).toLocaleString()}</p></div>${n.readAt?'':'<span class="zk-unread-dot mt-2"></span>'}<button class="zk-notification-delete" title="Delete notification" aria-label="Delete notification" onclick="deleteNotification('${String(n.id).replace(/[^a-zA-Z0-9_-]/g,'')}')"><i class="fa-solid fa-trash-can"></i></button></div>`}
        function renderNotificationList(){const el=document.getElementById('notificationList');if(!el)return;const list=(appState.notifications||[]).slice(0,50);el.innerHTML=list.length?list.map(notificationMarkup).join(''):`<div class="p-10 text-center text-gray-500"><i class="fa-regular fa-bell-slash text-3xl text-emerald-600"></i><p class="font-bold mt-3">No notifications yet</p></div>`;}
        async function markVisibleNotificationsRead(){const uid=auth?.currentUser?.uid;if(!uid||!db)return;const unread=(appState.notifications||[]).filter(n=>n.type!=='message'&&!n.readAt).slice(0,100);await Promise.allSettled(unread.map(n=>updateDoc(doc(db,'zapkairNotifications',uid,'items',n.id),{readAt:Date.now()})));}

        async function fetchListings() {

            if (!db || isDemoMode) {

                return;
            }
            try {
                const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'listings'));
                const querySnapshot = await getDocs(q);
                const fetched = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                window.appState.listings = fetched;
            } catch (e) {
                console.warn("Could not fetch marketplace listings:", e);

                                        <div class="shrink-0 w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold text-lg">
                                            <i class="fa-solid fa-user"></i>
                                        </div>
                                        <div class="zk-inbox-sub">

        function renderChatRoomView(chatId) {
          const chat=(appState.chats||[]).find(c=>c.id===chatId);

          const messages=visibleChatMessages(chatId);
          const role=chatRole(chat);
          const safeId=JSON.stringify(chatId).replace(/"/g,'&quot;');
          const myId=appState.user?.uid||'current-user';
          return `<div class="zk-chat-shell max-w-3xl mx-auto flex flex-col h-[calc(100dvh-128px)] md:h-[calc(100dvh-105px)] md:my-3 md:rounded-[28px] overflow-hidden shadow-xl">
            <header class="zk-chat-header flex items-center gap-3 px-3 sm:px-5 py-3 shrink-0">
              <button onclick="zapkairBack('chats')" aria-label="Back" class="zk-round"><i class="fa-solid fa-arrow-left"></i></button>

              <div class="flex-1 min-w-0"><h3 class="font-extrabold truncate text-[15px]">${escapeHTML(otherChatName(chat))}</h3><p class="text-[11px] text-emerald-600 font-medium">${role==='sell'?'Selling enquiry':'Buying enquiry'} · ${escapeHTML(chat.listingTitle||'Private conversation')}</p></div>
              <button onclick="openChatMenu(${safeId})" class="zk-round" aria-label="Chat options"><i class="fa-solid fa-ellipsis-vertical"></i></button>
            </header>
            <div id="chatMessagesBox" class="zk-chat-canvas flex-1 min-h-0 overflow-y-auto px-3 sm:px-5 py-5 space-y-3" aria-live="polite">
              ${messages.length?'<div class="zk-chat-day"><span>Messages</span></div>':''}
              ${messages.length?'':`<div class="zk-chat-empty"><i class="fa-regular fa-comments text-3xl mb-3 text-emerald-600"></i><h4 class="font-bold">Start your conversation</h4><p class="text-xs mt-1">Ask the seller about this phone</p></div>`}
              ${messages.map((m,i)=>{const mine=m.senderId===myId||m.senderId==='current-user';const ref=messages.find(x=>x.id===m.replyTo);return `<div class="zk-message-row ${mine?'zk-mine':'zk-theirs'}" data-message-index="${i}" data-chat-id="${escapeHTML(chatId)}">
                <div class="zk-swipe-hint"><i class="fa-solid fa-reply"></i></div>
                <div class="zk-message-wrap">${!mine?`<div class="text-[11px] font-semibold text-emerald-700 mb-1 ml-2">${escapeHTML(m.senderName||otherChatName(chat))}</div>`:``}<div class="zk-message-bubble ${m.unsent?'zk-unsent':''}">
                  ${ref?`<div class="zk-quoted">${ref.unsent?'Message unsent':ref.image?'📷 Photo':escapeHTML(ref.text||'Message unavailable')}</div>`:''}
                  ${m.unsent?`<p class="text-sm italic opacity-75"><i class="fa-solid fa-ban mr-1"></i>Message unsent</p>`:`${m.image?`<button onclick="openChatPhoto(${safeId},${i})" class="block" aria-label="View photo"><img draggable="false" oncontextmenu="return false" src="${m.image}" alt="Shared photo" class="rounded-2xl max-h-72 max-w-full object-contain" /></button>`:''}${m.text?`<p class="text-sm whitespace-pre-wrap leading-relaxed">${escapeHTML(m.text)}</p>`:''}`}
                  <div class="zk-message-time">${escapeHTML(m.time||'')} ${mine&&!m.unsent?'<i class="fa-solid fa-check-double ml-1"></i>':''}</div>
                </div><div class="zk-message-actions"><button onclick="replyToChatMessage(${safeId},${i})" title="Reply" aria-label="Reply"><i class="fa-solid fa-reply"></i></button>${mine&&!m.unsent?`<button onclick="unsendChatMessage(${safeId},${i})" title="Unsend" aria-label="Unsend"><i class="fa-solid fa-trash-can"></i></button>`:''}</div></div>
              </div>`}).join('')}
            </div>
            <div class="zk-composer-wrap shrink-0 px-3 sm:px-5 pt-3 pb-4">
              <div id="replyPreview" class="hidden zk-reply-preview"><i class="fa-solid fa-reply text-emerald-600"></i><span class="flex-1 truncate" id="replyPreviewText"></span><button onclick="cancelChatReply()" aria-label="Cancel reply"><i class="fa-solid fa-xmark"></i></button></div>
              <div class="zk-composer"><label title="Send photo" class="zk-attach"><i class="fa-regular fa-image"></i><input type="file" accept="image/jpeg,image/png,image/webp" class="hidden" onchange="sendChatPhoto(event,${safeId})" /></label>
              <textarea id="chatInputBox" enterkeyhint="send" autocomplete="off" rows="1" maxlength="3000" placeholder="Write a message..." class="zk-input" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatMessage(${safeId})}"></textarea>
              <button onclick="sendChatMessage(${safeId})" aria-label="Send message" class="zk-send"><i class="fa-solid fa-arrow-up"></i></button></div>
              ${messages.length?'<p class="text-center text-[10px] text-slate-500 mt-2">Swipe right to reply · Delete your own messages</p>':''}
            </div></div>`;
        }

        function zapTranslate(str){
          if(zapTranslations[str])return zapTranslations[str];

          return str;

        let zapApplying=false;

          if(zapApplying)return;

            document.documentElement.lang=hi?'hi':'en';
            const roots=['appContainer','modalContainer','toastContainer','desktopAuthNav'];
            roots.forEach(id=>{
              const root=document.getElementById(id);if(!root)return;
              const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
              const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
              nodes.forEach(node=>{
                if(!node.parentElement||node.parentElement.closest('script,style,textarea,option,[data-no-translate],.chat-message,.message-bubble'))return;
                const raw=node.textContent,trimmed=raw.trim();if(!trimmed)return;
                const english=node.__zapEnglish||trimmed;
                if(!node.__zapEnglish)node.__zapEnglish=english;

        window.initChatSwipe=function(){

            row.addEventListener('touchmove',e=>{if(!tracking||e.touches.length!==1)return;const dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;if(Math.abs(dy)>Math.abs(dx)*1.2)return;row.style.setProperty('--swipe-x',Math.max(0,Math.min(78,dx))+'px')},{passive:true});
            row.addEventListener('touchend',e=>{if(!tracking)return;tracking=false;const dx=e.changedTouches[0].clientX-startX;row.style.setProperty('--swipe-x','0px');if(dx>65&&Math.abs(e.changedTouches[0].clientY-startY)<100){replyToChatMessage(row.dataset.chatId,Number(row.dataset.messageIndex))}},{passive:true});

        window.sendChatMessage=async function(chatId){const input=document.getElementById('chatInputBox');const value=input?.value.trim();if(!value)return;const button=document.querySelector('.zk-send');if(button)button.disabled=true;try{await appendChatMessage(chatId,{text:value});if(input&&input.value.trim()===value){input.value='';input.style.height='auto'}}catch(e){console.error(e)}finally{if(button)button.disabled=false}};
        window.sendChatPhoto=async function(event,chatId){const file=event.target.files?.[0];event.target.value='';if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024){showToast('Use JPG, PNG or WebP under 5 MB','error');return}try{const img=await createImageBitmap(file);const canvas=document.createElement('canvas');const ratio=Math.min(1,1280/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*ratio));canvas.height=Math.max(1,Math.round(img.height*ratio));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);img.close();const data=canvas.toDataURL('image/jpeg',.76);if(data.length>950000){showToast('Photo too large for local preview. Try a smaller image.','error');return}appendChatMessage(chatId,{image:data})}catch(e){showToast('Could not process photo','error')}};
        window.openChatMenu=function(chatId){document.getElementById('modalContainer').innerHTML=`<div class="fixed inset-0 z-[80] bg-black/50 flex items-end sm:items-center justify-center" onclick="if(event.target===this)this.remove()"><div class="bg-white w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-5 space-y-3"><h3 class="font-bold text-lg">Chat options</h3><button class="w-full text-left p-3 rounded-xl bg-gray-50" onclick="manageChat(${JSON.stringify(chatId).replace(/"/g,'&quot;')},'clear')"><i class="fa-solid fa-broom mr-3"></i>Clear messages</button><button class="w-full text-left p-3 rounded-xl bg-red-50 text-red-700" onclick="manageChat(${JSON.stringify(chatId).replace(/"/g,'&quot;')},'delete')"><i class="fa-solid fa-trash mr-3"></i>Delete conversation</button><button class="w-full p-3" onclick="document.getElementById('modalContainer').innerHTML=''">Cancel</button></div></div>`};
        window.manageChat=function(id,action){
          if(!confirm(action==='clear'?'Clear your chat history? Older messages will stay hidden for your account.':'Remove this conversation from your inbox?'))return;
          const now=Date.now();saveChatPref(id,action==='clear'?{clearedAt:now}:{deletedAt:now,clearedAt:now});

        window.openChatPhoto=function(chatId,index){const m=appState.demoMessages?.[chatId]?.[index];if(!m?.image)return;const layer=document.createElement('div');layer.id='chatPhotoOverlay';layer.className='fixed inset-0 z-[110] bg-black/95 flex flex-col text-white';layer.innerHTML=`<div class="flex items-center justify-between p-4"><span class="text-sm">Photo viewer</span><button onclick="document.getElementById('chatPhotoOverlay')?.remove()" class="p-3" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div><div class="flex-1 overflow-auto flex items-center justify-center p-3"><img id="chatZoomImage" draggable="false" oncontextmenu="return false" alt="Shared photo" class="max-w-full max-h-full object-contain select-none" /></div><div class="flex justify-center gap-5 p-4"><button onclick="zoomChatPhoto(-.5)" class="px-6 py-2 bg-white/15 rounded-full">−</button><button onclick="zoomChatPhoto(.5)" class="px-6 py-2 bg-white/15 rounded-full">+</button></div>`;document.body.appendChild(layer);document.getElementById('chatZoomImage').src=m.image;window.chatZoom=1;let distance=0;layer.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(distance)zoomChatPhoto((d-distance)/150);distance=d}},{passive:true});layer.addEventListener('touchend',()=>distance=0)};
        window.zoomChatPhoto=function(delta){window.chatZoom=Math.max(1,Math.min(5,(window.chatZoom||1)+delta));const img=document.getElementById('chatZoomImage');if(img)img.style.transform=`scale(${window.chatZoom})`};

        // Compress photos before uploading; store URLs in Firestore, never large base64 blobs.
        async function compressPhoto(file, maxDimension=1440, quality=.76) {
            if (!file.type.startsWith('image/')) throw new Error('Please select an image');
            if (file.size > 20*1024*1024) throw new Error('Image must be under 20 MB');
            const bitmap=await createImageBitmap(file);
            try {
                const scale=Math.min(1,maxDimension/Math.max(bitmap.width,bitmap.height));
                const canvas=document.createElement('canvas');
                canvas.width=Math.max(1,Math.round(bitmap.width*scale));
                canvas.height=Math.max(1,Math.round(bitmap.height*scale));
                canvas.getContext('2d',{alpha:false}).drawImage(bitmap,0,0,canvas.width,canvas.height);
                const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',quality));
                if (!blob) throw new Error('Image compression failed');
                return blob;
            } finally { bitmap.close(); }
        }
        async function uploadListingPhotos(files, listingId, ownerId) {
            if (!files?.length) return [];
            if (!storage) throw new Error('Firebase Storage is not available');
            const uploaded=[];
            try {
                for (let i=0;i<files.length;i++) {
                    const blob=await compressPhoto(files[i]);
                    const path=`listingImages/${ownerId}/${listingId}/${Date.now()}_${i}.jpg`;
                    const ref=storageRef(storage,path);
                    await uploadBytes(ref,blob,{contentType:'image/jpeg',customMetadata:{listingId,ownerId}});
                    uploaded.push({path,url:await getDownloadURL(ref)});
                }
                return uploaded;
            } catch(error) {
                await Promise.allSettled(uploaded.map(item=>deleteObject(storageRef(storage,item.path))));
                throw error;
            }
        }
        async function deleteStoredPhotos(paths) {
            if (!storage || !paths?.length) return;
            const results=await Promise.allSettled(paths.filter(path=>typeof path==='string'&&path.startsWith('listingImages/')).map(path=>deleteObject(storageRef(storage,path))));
            const failed=results.find(r=>r.status==='rejected'&&r.reason?.code!=='storage/object-not-found');
            if (failed) throw failed.reason;
        }

        window.handleImageUpload = async function(event) {
            const files=Array.from(event.target.files||[]).slice(0,4);
            if(!files.length)return;
            const valid=files.filter(f=>f.type.startsWith('image/')&&f.size<=20*1024*1024);
            if(valid.length!==files.length)showToast('Use images smaller than 20 MB each.','error');
            window.appState.pendingPhotoFiles=valid;
            window.appState.uploadedImages=[];
            const previews=await Promise.all(valid.map(async file=>{
                try {const blob=await compressPhoto(file,960,.65);return URL.createObjectURL(blob);}catch(e){return null;}
            }));
            const box=document.getElementById('imagePreviewContainer');
            if(box)box.innerHTML=previews.filter(Boolean).map((src,i)=>`<div class="w-20 h-20 rounded-xl overflow-hidden relative flex-shrink-0 border border-gray-200"><img src="${src}" class="w-full h-full object-cover" alt="Phone photo ${i+1}"></div>`).join('');
            showToast(`${valid.length} photo(s) ready. They will upload when you publish the ad.`);
        };

        window.handleSellSubmit = async function(event, editId) {
            event.preventDefault();
            const brand = document.getElementById('sellBrand').value;
            const model = document.getElementById('sellModel').value.trim();
            const ram = document.getElementById('sellRam').value;
            const storage = document.getElementById('sellStorage').value;
            const condition = document.getElementById('sellCondition').value;
            const colour = document.getElementById('sellColour').value.trim();
            const price = Number(document.getElementById('sellPrice').value);
            const description = document.getElementById('sellDescription').value.trim();
            const location = document.getElementById('sellLocation').value.trim();
            if (!model || !description || !location || !Number.isFinite(price) || price < 1000 || price > 500000) {
                showToast('Please enter a valid model, description, location and price.', 'error'); return;
            }
            const old = editId ? window.appState.listings.find(l => l.id === editId) : null;
            if (editId && old && old.ownerId !== (window.appState.user?.uid || 'local-user')) { showToast('You cannot edit another seller’s listing.', 'error'); return; }
            if (!db || !auth?.currentUser) { showToast('Ad post karne ke liye pehle login karein.', 'error'); return; }
            const listingId=editId || ('listing-' + Date.now());
            const pendingFiles=window.appState.pendingPhotoFiles||[];
            let uploaded=[];
            try { uploaded=await uploadListingPhotos(pendingFiles,listingId,auth.currentUser.uid); }
            catch(error) { showToast(friendlyAppError(error, 'Photo upload nahi ho paayi. Chhoti photo ke saath dobara try karein.'),'error'); return; }
            const images=uploaded.length ? uploaded.map(p=>p.url) :
                (old?.imageUrls?.length ? old.imageUrls : ['https://placehold.co/600x600/10b981/ffffff?text=' + encodeURIComponent(model)]);
            const imagePaths=uploaded.length ? uploaded.map(p=>p.path) : (old?.imagePaths||[]);
            const newListing = {
                ...(old || {}), id: listingId,
                ownerId: window.appState.user?.uid || 'local-user',
                ownerName: window.appState.user?.displayName || 'Zapkair User',
                brand, model, ram, storage, condition, colour, price, description,
                imageUrls: images, imagePaths, approximateLocation: location,
                lat: window.appState.userLocation.lat, lng: window.appState.userLocation.lng,
                status: 'pending', moderationStatus: 'pending', createdAt: old?.createdAt || { seconds: Date.now() / 1000 },
                updatedAt: { seconds: Date.now() / 1000 }
            };
            if (editId) {
                const index = window.appState.listings.findIndex(l => l.id === editId);
                if (index > -1) window.appState.listings[index] = newListing;
                const myIndex = window.appState.myAds.findIndex(l => l.id === editId);
                if (myIndex > -1) window.appState.myAds[myIndex] = newListing;
                else window.appState.myAds.unshift(newListing);
                // Show success only after Firestore confirms the write.
            } else {
                window.appState.listings.unshift(newListing);
                window.appState.myAds.unshift(newListing);
                // Show success only after Firestore confirms the write.
            }
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'listings', newListing.id), newListing);
            } catch (error) {
                await Promise.allSettled(uploaded.map(p=>deleteObject(storageRef(storage,p.path))));
                showToast(friendlyAppError(error, 'Ad save nahi ho paaya. Dobara try karein.'), 'error');
                await fetchListings(); router.render(); return;
            }
            if (uploaded.length && old?.imagePaths?.length) deleteStoredPhotos(old.imagePaths).catch(console.warn);
            try{await createUserNotification(auth.currentUser.uid,{type:'ad-pending',title:'Ad submitted for review',body:`${brand} ${model} · ${formatINR(price)}. It will appear publicly after admin approval.`});}catch(notificationError){console.warn('Listing saved; notification unavailable:',notificationError)}
            showToast(editId?'Ad updated and sent for admin review.':'Ad submitted! It will appear after admin approval.');
            window.appState.uploadedImages = [];
            window.appState.pendingPhotoFiles = [];
            persistAppState();
            router.navigate('myads');
        };

        window.deleteMyAd = async function(id) {
            if (!window.appState.myAds.some(l => l.id === id)) { showToast('Listing not found in your ads.', 'error'); return; }
            if (!db || !auth?.currentUser) { showToast('Sign in to delete your listing.', 'error'); return; }
            const listing=window.appState.myAds.find(l => l.id === id);
            if(listing.ownerId!==auth.currentUser.uid){showToast('Only the owner can delete this ad.','error');return;}
            window.showConfirmDialog({
                title: 'Delete this ad?',
                message: `Are you sure you want to permanently delete “${listing.brand || ''} ${listing.model || 'this listing'}”? This cannot be undone and its managed photos will also be removed.`,
                confirmText: 'Yes, delete ad',
                cancelText: 'Keep my ad',
                danger: true,
                icon: 'fa-trash-can',
                onConfirm: () => performDeleteMyAd(id)
            });
        };

        async function performDeleteMyAd(id) {
            const listing=window.appState.myAds.find(l => l.id === id);
            if(!listing || !auth?.currentUser || listing.ownerId!==auth.currentUser.uid)return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'listings', id));
            } catch(e) { showToast('Delete failed: '+(e.message||'Please try again.'),'error'); return; }
            try { await deleteStoredPhotos(listing.imagePaths||[]); }
            catch(e) { console.warn('Photo cleanup failed',e); showToast('Ad deleted, but some photos could not be removed from Storage.','error'); }
            window.appState.listings = window.appState.listings.filter(l => l.id !== id);
            window.appState.myAds = window.appState.myAds.filter(l => l.id !== id);
            persistAppState();
            try{await createUserNotification(auth.currentUser.uid,{type:'ad-deleted',title:'Ad deleted',body:`${listing.brand||''} ${listing.model||'Your ad'} has been deleted.`});}catch(notificationError){console.warn('Ad deleted; notification unavailable:',notificationError)}
            showToast('Your ad has been deleted.');
            router.render();
        };

        window.handleAuthSubmit = function(event, mode) {
            event.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const name = document.getElementById('authName') ? document.getElementById('authName').value : 'Zapkair User';

            if (!email || password.length < 6) {
                showToast('Enter a valid email and a password with at least 6 characters.', 'error');
                return;
            }
            if (isFirebaseInitialized && !isDemoMode && auth) {
                const operation = mode === 'login'
                    ? signInWithEmailAndPassword(auth, email, password)
                    : createUserWithEmailAndPassword(auth, email, password).then(async cred => {
                        await updateProfile(cred.user, { displayName: name });
                        return cred;
                    });
                operation.then(cred => {
                    window.appState.user = cred.user;
                    persistAppState();
                    showToast(mode === 'login' ? 'Signed in successfully!' : 'Account created successfully!');
                    router.navigate('home');
                }).catch(err => showToast(friendlyAppError(err, 'Login nahi ho paaya. Dobara try karein.'), 'error'));
                return;

            showToast('Login service abhi available nahi hai. Thodi der baad try karein.', 'error');
        };
